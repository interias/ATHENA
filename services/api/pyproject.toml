[project]
name = "athena-api"
version = "0.1.0"
description = "Local ATHENA learning studio API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
  "hatchling==1.32.0",
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
